# vroom OBD-II log page, served by the default vhost from /var/www/html/vroom.
#
#   sudo cp deploy/apache-vroom.conf /etc/apache2/conf-available/vroom.conf
#   sudo a2enconf vroom && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Open to the LAN with no login, like the other static sites on this VM. The data folder
# holds the car's OBD log, its VIN and fault codes, and the board's firmware version --
# nothing that controls anything.

<Directory /var/www/html/vroom>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    # mods-enabled/deflate.conf leaves CSV and JSON out; the log compresses several times over.
    AddOutputFilterByType DEFLATE text/csv application/json
</Directory>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0, user-scalable=no">
  <title>vroom — Spectra dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

<header>
  <h1>2009 Kia Spectra</h1>
  <div class="status-pills">
    <span id="pill-engine" class="pill pill-off">Engine</span>
    <span id="pill-esp32" class="pill">ESP32: idle</span>
    <span id="pill-wifi" class="pill">WiFi: -</span>
  </div>
</header>

<main>
  <section class="gauges">
    <div class="gauge gauge-large" id="gauge-voltage">
      <div class="label">Battery</div>
      <div class="value"><span id="v-battery">--</span><span class="units">V</span></div>
      <svg class="sparkline" data-spark="control_module_voltage"
           viewBox="0 0 60 18" preserveAspectRatio="none"></svg>
    </div>

    <div class="gauge" id="gauge-rpm">
      <div class="label">RPM</div>
      <div class="value"><span id="v-rpm">--</span></div>
      <svg class="sparkline" data-spark="rpm"
           viewBox="0 0 60 14" preserveAspectRatio="none"></svg>
    </div>

    <div class="gauge" id="gauge-speed">
      <div class="label">Speed</div>
      <div class="value"><span id="v-speed">--</span><span class="units">km/h</span></div>
      <svg class="sparkline" data-spark="speed"
           viewBox="0 0 60 14" preserveAspectRatio="none"></svg>
    </div>

    <div class="gauge" id="gauge-coolant">
      <div class="label">Coolant</div>
      <div class="value"><span id="v-coolant">--</span><span class="units">&deg;C</span></div>
      <svg class="sparkline" data-spark="coolant_temp"
           viewBox="0 0 60 14" preserveAspectRatio="none"></svg>
    </div>

    <div class="gauge" id="gauge-throttle">
      <div class="label">Throttle</div>
      <div class="value"><span id="v-throttle">--</span><span class="units">%</span></div>
      <svg class="sparkline" data-spark="throttle_position"
           viewBox="0 0 60 14" preserveAspectRatio="none"></svg>
    </div>

    <div class="gauge" id="gauge-fuel">
      <div class="label">Fuel</div>
      <div class="value"><span id="v-fuel">--</span><span class="units">%</span></div>
      <svg class="sparkline" data-spark="fuel_level"
           viewBox="0 0 60 14" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="controls">
    <button class="btn btn-start" id="btn-start">Start Engine</button>
    <button class="btn btn-stop"  id="btn-stop">Stop Engine</button>
    <button class="btn btn-ping"  id="btn-ping">Ping ESP32</button>
  </section>

  <section class="manual-tx">
    <div class="manual-tx-header">Manual control</div>
    <div class="manual-tx-buttons">
      <button class="btn btn-tx btn-tx-start"  data-tx="start">Start</button>
      <button class="btn btn-tx btn-tx-lock"   data-tx="lock">Lock</button>
      <button class="btn btn-tx btn-tx-unlock" data-tx="unlock">Unlock</button>
      <button class="btn btn-tx btn-tx-trunk"  data-tx="trunk">Trunk</button>
    </div>
  </section>

  <section class="trips">
    <div class="trips-header">Recent trips</div>
    <table class="trips-table">
      <thead>
        <tr>
          <th>Start</th><th>Dur</th><th>Source</th>
          <th>V&#x2009;start</th><th>V&#x2009;end</th>
          <th>Peak RPM</th><th>Peak&nbsp;CT</th>
        </tr>
      </thead>
      <tbody id="trips-body">
        <tr><td class="trips-empty" colspan="7">No trips yet</td></tr>
      </tbody>
    </table>
  </section>

  <section class="events">
    <div class="events-header">Recent events</div>
    <ul class="events-list" id="events-list">
      <li class="events-empty">No events yet</li>
    </ul>
  </section>

  <section class="status-bar">
    <span id="last-update">Updated: never</span>
    <span id="uptime">Uptime: --</span>
  </section>
</main>

<script>
  // Inject poll interval from server-side config
  window.POLL_MS = {{ poll_ms }};
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
